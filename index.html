<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Oxford Maps</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .map-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Screen */

    #loader {
      position: fixed;
      inset: 0;

      background: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      z-index: 9999;

      transition: opacity 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 50px;
      height: 50px;

      border: 4px solid #d9d9d9;
      border-top-color: #002147;

      border-radius: 50%;

      animation: spin 1s linear infinite;

      margin-bottom: 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #002147;
      font-size: 1rem;
    }

  </style>

</head>

<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">
      Loading Oxford Map...
    </div>
  </div>

  <main class="map-container">

    <iframe
      id="mapFrame"
      src="https://oues.maps.arcgis.com/apps/instant/sidebar/index.html?appid=bd8620e0d080465ea66306344134c143"
      title="Oxford University Map"
      allowfullscreen
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

  </main>

  <script>

    const iframe = document.getElementById("mapFrame");
    const loader = document.getElementById("loader");

    iframe.addEventListener("load", () => {
      loader.classList.add("hidden");
    });

  </script>

</body>
</html>
